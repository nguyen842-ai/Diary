<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Của Tôi - Có Đăng Nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        /* CSS Biến toàn cục (Hỗ trợ Sáng/Tối) */
        :root {
            --bg-color: #f9f9f7;
            --text-color: #333333;
            --light-text: #888888;
            --border-color: #e5e5e5;
            --accent-color: #5a5a5a;
            --panel-bg: #ffffff;
            --hover-bg: #f0f0f0;
            --editor-fs: 17px;
        }

        /* Chế độ tối (Dark Mode) */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --light-text: #aaaaaa;
            --border-color: #444444;
            --accent-color: #888888;
            --panel-bg: #2d2d2d;
            --hover-bg: #3d3d3d;
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            height: 100vh;
            overflow: hidden;
        }

        /* --- MÀN HÌNH ĐĂNG NHẬP / AUTH SCREEN --- */
        #auth-screen {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 9999;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 350px;
            background: var(--panel-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .auth-container h1 {
            font-weight: 400;
            font-style: italic;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .auth-input:focus {
            border-color: var(--accent-color);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .auth-btn:hover { background-color: #333; }
        
        .auth-switch {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--light-text);
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
        }

        .auth-msg {
            margin-top: 15px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        .auth-msg.error { color: #d9534f; }
        .auth-msg.success { color: #5cb85c; }

        /* --- BẢNG ĐIỀU KHIỂN (SIDEBAR) --- */
        #main-app {
            display: none; /* Ẩn đi cho đến khi đăng nhập xong */
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            left: -300px;
            top: 0;
            transition: left 0.3s ease;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .sidebar.open { left: 0; }

        .sidebar-header {
            padding: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn { background: none; border: none; font-size: 24px; color: var(--text-color); cursor: pointer; }

        .sidebar-box { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .sidebar-box h3 { font-family: 'Inter', sans-serif; font-size: 13px; text-transform: uppercase; color: var(--light-text); margin-top: 0; margin-bottom: 15px; }

        .setting-item { margin-bottom: 15px; font-family: 'Inter', sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
        .setting-item input[type="range"] { width: 100px; }
        .btn-logout { width: 100%; padding: 10px; background: none; border: 1px solid #d9534f; color: #d9534f; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; transition: 0.3s; margin-top: 10px;}
        .btn-logout:hover { background: #d9534f; color: white; }

        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { margin-bottom: 15px; }
        .history-item a { text-decoration: none; color: var(--text-color); display: block; padding: 8px; border-radius: 6px; transition: background 0.2s; }
        .history-item a:hover { background-color: var(--hover-bg); }
        .history-title { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-date { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--light-text); }

        /* --- PHẦN NỘI DUNG CHÍNH --- */
        .main-content {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 0 20px;
            transition: margin-left 0.3s ease;
        }

        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            z-index: 900;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .container {
            max-width: 680px;
            margin: 60px auto 50px auto;
        }

        /* --- TRÌNH SOẠN THẢO (EDITOR) --- */
        .editor-section {
            background: var(--panel-bg);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-bottom: 50px;
        }

        .input-title { width: 100%; border: none; border-bottom: 1px dashed var(--border-color); font-family: 'Lora', serif; font-size: 22px; font-weight: 500; padding-bottom: 10px; margin-bottom: 15px; background: transparent; color: var(--text-color); outline: none; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .toolbar button, .toolbar input[type="color"] { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; }
        .toolbar button:hover { background: var(--hover-bg); }

        .editor-box { width: 100%; min-height: 200px; outline: none; font-size: var(--editor-fs); line-height: 1.8; color: var(--text-color); }
        .editor-box[placeholder]:empty:before { content: attr(placeholder); color: #bbbbbb; font-style: italic; pointer-events: none; display: block; }

        .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
        .btn-save { font-family: 'Inter', sans-serif; background-color: var(--accent-color); color: white; border: none; padding: 8px 24px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: background 0.3s; }
        .btn-save:hover { background-color: #333; }

        /* --- BÀI VIẾT CŨ --- */
        .entries-section h2 { font-family: 'Inter', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--light-text); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 30px; }
        .entry { margin-bottom: 50px; position: relative; scroll-margin-top: 80px; }
        .entry-title { font-size: 20px; font-weight: 500; margin-bottom: 5px; color: var(--text-color); }
        .entry-date { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--light-text); margin-bottom: 15px; }
        .entry-content { font-size: var(--editor-fs); line-height: 1.8; }
        .delete-btn { position: absolute; top: 0; right: 0; background: none; border: none; color: #d9534f; padding: 0; font-size: 13px; cursor: pointer; opacity: 0; }
        .entry:hover .delete-btn { opacity: 1; }

        /* Toast thông báo */
        #toast { visibility: hidden; background-color: #333; color: #fff; text-align: center; border-radius: 4px; padding: 12px 20px; position: fixed; z-index: 2000; bottom: 30px; left: 50%; transform: translateX(-50%); font-family: 'Inter', sans-serif; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen">
        <div class="auth-container">
            <h1>Nhật Ký Của Tôi</h1>
            <input type="email" id="auth-email" class="auth-input" placeholder="Email của bạn">
            <input type="password" id="auth-password" class="auth-input" placeholder="Mật khẩu">
            
            <button class="auth-btn" id="btn-login" onclick="handleAuth('login')">Đăng Nhập</button>
            <button class="auth-switch" onclick="toggleAuthMode()">Chưa có tài khoản? Đăng ký ngay</button>
            
            <div id="auth-message" class="auth-msg"></div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH (Chỉ hiện khi đã đăng nhập) -->
    <div id="main-app">
        <!-- Nút mở Menu -->
        <button class="menu-btn" id="openMenuBtn">☰ Bảng điều khiển</button>

        <!-- BẢNG ĐIỀU KHIỂN (SIDEBAR) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                Tùy chỉnh & Lịch sử
                <button class="close-btn" id="closeMenuBtn">&times;</button>
            </div>
            
            <!-- Box 1: Cài đặt & Tài khoản -->
            <div class="sidebar-box">
                <div style="font-family: 'Inter', sans-serif; font-size: 13px; margin-bottom: 15px;">
                    Đang đăng nhập: <strong id="user-email-display">...</strong>
                </div>
                <div class="setting-item">
                    <label>Chế độ Tối (Dark Mode)</label>
                    <input type="checkbox" id="darkModeToggle">
                </div>
                <div class="setting-item">
                    <label>Kích cỡ chữ</label>
                    <input type="range" id="fontSizeSlider" min="14" max="24" value="17">
                </div>
                <button class="btn-logout" onclick="handleLogout()">Đăng Xuất</button>
            </div>

            <!-- Box 2: Lịch sử -->
            <div class="sidebar-box">
                <h3>Nhật ký cũ</h3>
                <ul class="history-list" id="sidebarHistoryList">
                    <li style="font-size: 13px; color: gray;">Đang tải...</li>
                </ul>
            </div>
        </div>

        <!-- NỘI DUNG CHÍNH -->
        <div class="main-content">
            <div class="container">
                <header style="text-align: center; margin-bottom: 30px;">
                    <h1 style="font-weight: 400; font-style: italic; font-size: 28px;">Trang Nhật Ký</h1>
                </header>

                <main>
                    <!-- TRÌNH SOẠN THẢO (EDITOR) -->
                    <div class="editor-section">
                        <input type="text" id="entryTitle" class="input-title" placeholder="Tiêu đề nhật ký (Không bắt buộc)">
                        
                        <!-- Thanh công cụ soạn thảo -->
                        <div class="toolbar">
                            <button type="button" onclick="formatText('bold')" title="In đậm"><b>B</b></button>
                            <button type="button" onclick="formatText('italic')" title="In nghiêng"><i>I</i></button>
                            <div style="display:flex; align-items:center; gap:5px; border:1px solid var(--border-color); padding: 0 5px; border-radius: 4px;">
                                <span style="font-size: 13px;">Màu chữ:</span>
                                <input type="color" id="textColorPicker" onchange="changeColor(this.value)" style="border:none; padding:0; width: 20px; height: 25px;">
                            </div>
                            <button type="button" onclick="formatText('justifyLeft')" title="Căn trái">Trái</button>
                            <button type="button" onclick="formatText('justifyCenter')" title="Căn giữa">Giữa</button>
                            <button type="button" onclick="formatText('justifyRight')" title="Căn phải">Phải</button>
                        </div>

                        <div id="diaryEditor" class="editor-box" contenteditable="true" placeholder="Hôm nay bạn cảm thấy thế nào? Hãy viết ra đây..."></div>
                        
                        <div class="actions">
                            <button id="saveBtn" class="btn-save">Lưu lại</button>
                        </div>
                    </div>

                    <!-- BÀI VIẾT CŨ -->
                    <div class="entries-section">
                        <h2>Những ngày đã qua</h2>
                        <div id="entriesList"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- Thông báo -->
    <div id="toast">Thông báo</div>

    <!-- MÃ JAVASCRIPT & FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // Bổ sung getAuth để xử lý đăng nhập
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBGmLt1ka6mEVFcAlKU0-q6or66jTsuep4",
            authDomain: "uyen-fdf7d.firebaseapp.com",
            projectId: "uyen-fdf7d",
            storageBucket: "uyen-fdf7d.firebasestorage.app",
            messagingSenderId: "539808857702",
            appId: "1:539808857702:web:bf074ecdde987bfcdc37a7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const diaryCollection = collection(db, "diaries");

        let currentUser = null; // Biến lưu người dùng hiện tại

        // UI Elements - Auth
        const authScreen = document.getElementById('auth-screen');
        const mainApp = document.getElementById('main-app');
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const authMsg = document.getElementById('auth-message');
        const btnLogin = document.getElementById('btn-login');
        const userEmailDisplay = document.getElementById('user-email-display');

        // UI Elements - App
        const diaryEditor = document.getElementById('diaryEditor');
        const entryTitle = document.getElementById('entryTitle');
        const saveBtn = document.getElementById('saveBtn');
        const entriesList = document.getElementById('entriesList');
        const sidebarHistoryList = document.getElementById('sidebarHistoryList');
        const toast = document.getElementById('toast');

        /* --- XỬ LÝ XÁC THỰC (AUTHENTICATION) --- */
        let isLoginMode = true;

        window.toggleAuthMode = function() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                btnLogin.innerText = "Đang Nhập";
                document.querySelector('.auth-switch').innerText = "Chưa có tài khoản? Đăng ký ngay";
            } else {
                btnLogin.innerText = "Tạo Tài Khoản Mới";
                document.querySelector('.auth-switch').innerText = "Đã có tài khoản? Đăng nhập";
            }
            authMsg.style.display = "none";
        };

        window.handleAuth = async function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                authMsg.innerText = "Vui lòng nhập Email và Mật khẩu!";
                authMsg.className = "auth-msg error";
                authMsg.style.display = "block";
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerText = "Đang xử lý...";

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                // Nếu thành công, listener onAuthStateChanged sẽ tự động chạy
            } catch (error) {
                console.error(error);
                authMsg.className = "auth-msg error";
                authMsg.style.display = "block";
                if (error.code === 'auth/email-already-in-use') authMsg.innerText = "Lỗi: Email này đã được đăng ký!";
                else if (error.code === 'auth/invalid-credential') authMsg.innerText = "Lỗi: Sai email hoặc mật khẩu!";
                else if (error.code === 'auth/weak-password') authMsg.innerText = "Lỗi: Mật khẩu phải có ít nhất 6 ký tự!";
                else authMsg.innerText = "Lỗi hệ thống. Vui lòng thử lại!";
                
                btnLogin.disabled = false;
                btnLogin.innerText = isLoginMode ? "Đăng Nhập" : "Tạo Tài Khoản Mới";
            }
        };

        window.handleLogout = async function() {
            if(confirm("Bạn có chắc muốn đăng xuất?")) {
                await signOut(auth);
            }
        };

        // Lắng nghe trạng thái đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Đã đăng nhập
                currentUser = user;
                authScreen.style.display = 'none';
                mainApp.style.display = 'block';
                userEmailDisplay.innerText = user.email;
                
                // Reset form login
                emailInput.value = "";
                passwordInput.value = "";
                btnLogin.disabled = false;
                btnLogin.innerText = isLoginMode ? "Đăng Nhập" : "Tạo Tài Khoản Mới";
                
                // Bắt đầu tải dữ liệu RIÊNG của người dùng này
                loadEntries();
            } else {
                // Đã đăng xuất
                currentUser = null;
                authScreen.style.display = 'flex';
                mainApp.style.display = 'none';
                
                // Xóa dữ liệu cũ trên màn hình
                entriesList.innerHTML = '';
                sidebarHistoryList.innerHTML = '';
                document.getElementById('sidebar').classList.remove('open');
            }
        });

        /* --- XỬ LÝ SIDEBAR VÀ CÀI ĐẶT --- */
        const sidebar = document.getElementById('sidebar');
        document.getElementById('openMenuBtn').addEventListener('click', () => sidebar.classList.add('open'));
        document.getElementById('closeMenuBtn').addEventListener('click', () => sidebar.classList.remove('open'));

        const darkModeToggle = document.getElementById('darkModeToggle');
        darkModeToggle.addEventListener('change', (e) => {
            if(e.target.checked) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
        });

        const fontSizeSlider = document.getElementById('fontSizeSlider');
        fontSizeSlider.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--editor-fs', e.target.value + 'px');
        });

        /* --- XỬ LÝ TRÌNH SOẠN THẢO THÔNG MINH --- */
        window.formatText = function(command) {
            document.execCommand(command, false, null);
            diaryEditor.focus();
        };
        window.changeColor = function(color) {
            document.execCommand('foreColor', false, color);
            diaryEditor.focus();
        };

        function showToast(message) {
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('vi-VN', options);
        }

        /* --- TẢI & LƯU DỮ LIỆU (ĐÃ THÊM ĐIỀU KIỆN user_id) --- */
        async function loadEntries() {
            if (!currentUser) return; // Bảo mật: Không tải nếu chưa có user

            try {
                // CHÚ Ý: Đã thêm where("userId", "==", currentUser.uid) để chỉ lấy bài của người đang đăng nhập
                const q = query(diaryCollection, where("userId", "==", currentUser.uid), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                entriesList.innerHTML = '';
                sidebarHistoryList.innerHTML = '';

                if(querySnapshot.empty) {
                    entriesList.innerHTML = '<p>Bạn chưa có trang nhật ký nào. Hãy viết dòng đầu tiên nhé!</p>';
                    sidebarHistoryList.innerHTML = '<li style="font-size: 13px; color: gray;">Chưa có bài viết</li>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const dateStr = formatDate(data.createdAt);
                    const displayTitle = data.title && data.title.trim() !== "" ? data.title : "Nhật ký không tên";

                    // 1. Thêm vào Main Content
                    const entryDiv = document.createElement('div');
                    entryDiv.className = 'entry';
                    entryDiv.id = `entry-${docId}`;
                    
                    entryDiv.innerHTML = `
                        <button class="delete-btn" data-id="${docId}">Xóa</button>
                        <div class="entry-title">${displayTitle}</div>
                        <div class="entry-date">${dateStr}</div>
                        <div class="entry-content">${data.content}</div>
                    `;
                    entriesList.appendChild(entryDiv);

                    // 2. Thêm vào Sidebar
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.innerHTML = `
                        <a href="#entry-${docId}" onclick="document.getElementById('sidebar').classList.remove('open')">
                            <div class="history-title">${displayTitle}</div>
                            <div class="history-date">${dateStr}</div>
                        </a>
                    `;
                    sidebarHistoryList.appendChild(li);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if(confirm("Xóa bài viết này?")) {
                            await deleteDoc(doc(db, "diaries", e.target.getAttribute('data-id')));
                            showToast("Đã xóa bài viết!");
                            loadEntries();
                        }
                    });
                });
            } catch (error) {
                console.error("Lỗi khi tải nhật ký (Có thể do thiếu Index trên Firebase):", error);
                entriesList.innerHTML = '<p style="color:red;">Lỗi tải dữ liệu. Nếu bạn vừa tạo, hãy chờ Firebase tạo Index cho cấu trúc mới này.</p>';
            }
        }

        saveBtn.addEventListener('click', async () => {
            if (!currentUser) return; // Bảo mật

            const title = entryTitle.value.trim();
            const content = diaryEditor.innerHTML.trim(); 
            
            if (content === "" || content === "<br>") {
                showToast("Bạn chưa viết nội dung!");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "Đang lưu...";

            try {
                // CHÚ Ý: Lưu thêm trường userId vào Database để biết bài này của ai
                await addDoc(diaryCollection, {
                    userId: currentUser.uid, 
                    title: title,
                    content: content,
                    createdAt: new Date().toISOString()
                });
                
                entryTitle.value = "";
                diaryEditor.innerHTML = "";
                showToast("Lưu thành công!");
                loadEntries();

            } catch (error) {
                console.error(error);
                showToast("Lỗi khi lưu!");
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Lưu lại";
            }
        });
    </script>
</body>
</html>
