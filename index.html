<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My diary</title>
    <!-- Thêm font chữ viết tay Patrick Hand (hỗ trợ tiếng Việt) và Dancing Script -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        /* CSS Biến toàn cục (Hỗ trợ Sáng/Tối) */
        :root {
            --text-color: #222222;
            --light-text: #666666;
            --border-color: rgba(150, 150, 150, 0.4);
            --accent-color: #5a5a5a;
            --panel-bg: rgba(255, 255, 255, 0.85); /* Chỉ dùng cho sidebar và popup */
            --hover-bg: rgba(200, 200, 200, 0.3);
            --editor-fs: 22px; /* Chữ viết tay cần to hơn một chút */
            --handwriting-font: 'Patrick Hand', cursive;
        }

        /* Chế độ tối (Dark Mode) */
        body.dark-mode {
            --text-color: #f5f5f5;
            --light-text: #cccccc;
            --border-color: rgba(200, 200, 200, 0.3);
            --panel-bg: rgba(30, 30, 30, 0.9);
            --hover-bg: rgba(80, 80, 80, 0.4);
        }

        body { 
            font-family: 'Lora', serif; 
            color: var(--text-color); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6; 
            transition: color 0.3s; 
            height: 100vh; 
            overflow: hidden; 
            /* SỬ DỤNG FILE 1.JPG LÀM HÌNH NỀN */
            background: url('1.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Lớp phủ cho chế độ tối (30% opacity) */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0);
            z-index: -1;
            transition: background 0.3s ease;
            pointer-events: none;
        }
        body.dark-mode .bg-overlay {
            background: rgba(0, 0, 0, 0.4);
        }

        /* --- MÀN HÌNH ĐĂNG NHẬP / AUTH SCREEN --- */
        #auth-screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-container { width: 100%; max-width: 350px; background: var(--panel-bg); padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 30px rgba(0,0,0,0.1); text-align: center; border: 1px solid var(--border-color); backdrop-filter: blur(5px); }
        .auth-container h1 { font-family: 'Dancing Script', cursive; font-size: 42px; margin-top: 0; margin-bottom: 30px; color: var(--text-color); }
        .auth-input { width: 100%; padding: 14px 15px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 8px; background: rgba(255,255,255,0.5); color: var(--text-color); font-family: 'Inter', sans-serif; font-size: 15px; box-sizing: border-box; outline: none; }
        body.dark-mode .auth-input { background: rgba(0,0,0,0.3); }
        .auth-input:focus { border-color: var(--accent-color); }
        .auth-btn { width: 100%; padding: 14px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 16px; cursor: pointer; margin-bottom: 15px; }
        .auth-switch { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--light-text); cursor: pointer; text-decoration: underline; background: none; border: none; margin-bottom: 10px;}
        .auth-forgot { font-family: 'Inter', sans-serif; font-size: 12px; color: #d9534f; cursor: pointer; text-decoration: underline; background: none; border: none; display: block; width: 100%; margin-top: 5px;}
        .auth-msg { margin-top: 15px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; display: none; }
        .auth-msg.error { color: #d9534f; } .auth-msg.success { color: #5cb85c; }

        /* --- BẢNG ĐIỀU KHIỂN (SIDEBAR) --- */
        #main-app { display: none; width: 100%; height: 100%; }
        .sidebar { width: 300px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color); height: 100vh; overflow-y: auto; position: fixed; left: -300px; top: 0; transition: left 0.3s ease; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; backdrop-filter: blur(10px); }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 20px; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 500; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; font-size: 24px; color: var(--text-color); cursor: pointer; }
        .sidebar-box { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .sidebar-box h3 { font-family: 'Inter', sans-serif; font-size: 13px; text-transform: uppercase; color: var(--light-text); margin-top: 0; margin-bottom: 15px; }
        .setting-item { margin-bottom: 15px; font-family: 'Inter', sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
        .setting-item input[type="range"] { width: 100px; }
        
        .btn-trash-menu { width: 100%; padding: 10px; background: var(--hover-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .btn-logout { width: 100%; padding: 10px; background: none; border: 1px solid #d9534f; color: #d9534f; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; transition: 0.3s; margin-top: 10px;}
        .btn-logout:hover { background: #d9534f; color: white; }

        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { margin-bottom: 15px; }
        .history-item a { text-decoration: none; color: var(--text-color); display: block; padding: 8px; border-radius: 6px; transition: background 0.2s; }
        .history-item a:hover { background-color: var(--hover-bg); }
        .history-title { font-family: var(--handwriting-font); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-date { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--light-text); }

        /* --- PHẦN NỘI DUNG CHÍNH (TRÀN MÀN HÌNH) --- */
        .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; padding: 0 20px; transition: margin-left 0.3s ease; }
        .menu-btn { position: fixed; top: 20px; left: 20px; background-color: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; z-index: 900; box-shadow: 0 2px 5px rgba(0,0,0,0.1); backdrop-filter: blur(5px); }
        .container { width: 100%; max-width: 1000px; margin: 50px auto 80px auto; }

        .diary-title {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 90px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-color);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* --- TRÌNH SOẠN THẢO (VIẾT TRỰC TIẾP LÊN NỀN) --- */
        .editor-section { background: transparent; padding: 20px 0; margin-bottom: 50px; }
        
        .input-title { 
            width: 100%; 
            border: none; 
            border-bottom: 1px dashed var(--border-color); 
            font-family: var(--handwriting-font); 
            font-size: 45px; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            background: transparent; 
            color: var(--text-color); 
            outline: none; 
        }
        .input-title::placeholder { color: var(--light-text); opacity: 0.7; }
        
        .toolbar { display: flex; gap: 8px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border-color); flex-wrap: wrap; justify-content: flex-end; }
        
        .toolbar button, .toolbar input[type="color"] { background: rgba(255,255,255,0.4); border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; transition: 0.2s; backdrop-filter: blur(3px);}
        body.dark-mode .toolbar button, body.dark-mode .toolbar input[type="color"] { background: rgba(0,0,0,0.3); color: #fff;}
        .toolbar button:hover { background: var(--hover-bg); }
        
        /* Box nhập liệu chữ viết tay */
        .editor-box { 
            width: 100%; 
            min-height: 40vh; 
            outline: none; 
            font-family: var(--handwriting-font);
            font-size: var(--editor-fs); 
            line-height: 1.8; 
            letter-spacing: 1px;
            color: var(--text-color); 
            padding-top: 10px; 
        }
        .editor-box[placeholder]:empty:before { content: attr(placeholder); color: var(--light-text); opacity: 0.7; pointer-events: none; display: block; }
        
        .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
        .btn-save { font-family: 'Inter', sans-serif; background-color: var(--text-color); color: var(--panel-bg); border: none; padding: 8px 25px; border-radius: 25px; font-size: 14px; cursor: pointer; transition: 0.3s; font-weight: bold; opacity: 0.8;}
        .btn-save:hover { opacity: 1; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* --- BÀI VIẾT CŨ --- */
        .entries-section { background: transparent; padding: 20px 0; }
        .entries-section h2 { font-family: 'Inter', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--light-text); border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 30px; text-align: center;}
        
        .entry { margin-bottom: 40px; position: relative; scroll-margin-top: 80px; padding-bottom: 30px; border-bottom: 1px dashed var(--border-color); }
        .entry:last-child { border-bottom: none; }
        .entry-title { font-family: var(--handwriting-font); font-size: 30px; margin-bottom: 5px; color: var(--text-color); }
        .entry-date { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--light-text); margin-bottom: 15px; }
        
        .entry-content { 
            font-family: var(--handwriting-font);
            font-size: var(--editor-fs); 
            line-height: 1.8;
            letter-spacing: 1px; 
        }
        
        .delete-btn { position: absolute; top: 0; right: 0; background: none; border: 1px solid #d9534f; border-radius: 4px; color: #d9534f; padding: 3px 8px; font-size: 11px; cursor: pointer; opacity: 0; transition: 0.2s; font-family: 'Inter', sans-serif;}
        .entry:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #d9534f; color: white; }

        /* --- MODAL THÙNG RÁC --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel-bg); width: 90%; max-width: 600px; border-radius: 12px; padding: 25px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px;}
        .modal-header h2 { margin: 0; font-family: 'Inter', sans-serif; font-size: 18px; color: var(--text-color); }
        .trash-item { border: 1px dashed var(--border-color); padding: 15px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.02);}
        body.dark-mode .trash-item { background: rgba(255,255,255,0.02); }
        .trash-title { font-family: var(--handwriting-font); font-size: 22px; margin-bottom: 5px; color: var(--text-color);}
        .trash-actions { display: flex; gap: 10px; margin-top: 10px;}
        .btn-restore { background: #5cb85c; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif;}
        .btn-hard-delete { background: #d9534f; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif;}

        #toast { visibility: hidden; background-color: #333; color: #fff; text-align: center; border-radius: 30px; padding: 12px 25px; position: fixed; z-index: 4000; bottom: 30px; left: 50%; transform: translateX(-50%); font-family: 'Inter', sans-serif; font-size: 14px; opacity: 0; transition: opacity 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <!-- Lớp phủ tối màu cho chế độ Dark Mode -->
    <div class="bg-overlay"></div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="auth-screen">
        <div class="auth-container">
            <h1>My diary</h1>
            <input type="email" id="auth-email" class="auth-input" placeholder="Email của bạn">
            <input type="password" id="auth-password" class="auth-input" placeholder="Mật khẩu">
            
            <button class="auth-btn" id="btn-login" onclick="handleAuth('login')">Đăng Nhập</button>
            <button class="auth-switch" onclick="toggleAuthMode()">Chưa có tài khoản? Đăng ký ngay</button>
            <button class="auth-forgot" onclick="handleForgotPassword()">Quên mật khẩu?</button>
            
            <div id="auth-message" class="auth-msg"></div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="main-app">
        <button class="menu-btn" id="openMenuBtn">☰ Bảng điều khiển</button>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                Cài đặt & Lịch sử
                <button class="close-btn" id="closeMenuBtn">&times;</button>
            </div>
            
            <div class="sidebar-box">
                <div style="font-family: 'Inter', sans-serif; font-size: 13px; margin-bottom: 15px; color: var(--light-text);">
                    Tài khoản: <strong id="user-email-display" style="color: var(--text-color);">...</strong>
                </div>
                <div class="setting-item"><label>Chế độ Tối</label><input type="checkbox" id="darkModeToggle"></div>
                <div class="setting-item"><label>Cỡ chữ</label><input type="range" id="fontSizeSlider" min="18" max="36" value="22"></div>
                
                <button class="btn-trash-menu" onclick="openTrashModal()">Thùng rác</button>
                <button class="btn-logout" onclick="handleLogout()">Đăng Xuất</button>
            </div>

            <div class="sidebar-box">
                <h3>Nhật ký cũ</h3>
                <ul class="history-list" id="sidebarHistoryList"><li style="font-size: 13px; color: gray;">Đang tải...</li></ul>
            </div>
        </div>

        <div class="main-content">
            <div class="container">
                <header><h1 class="diary-title">My diary</h1></header>
                <main>
                    <div class="editor-section">
                        <input type="text" id="entryTitle" class="input-title" placeholder="Chủ đề hôm nay...">
                        
                        <div class="toolbar">
                            <button type="button" onclick="insertTab()" title="Thêm khoảng lùi đầu dòng">Tab ⇥</button>
                            <button type="button" onclick="formatText('bold')" title="In đậm"><b>B</b></button>
                            <button type="button" onclick="formatText('italic')" title="In nghiêng"><i>I</i></button>
                            <button type="button" onclick="formatText('justifyLeft')" title="Căn trái">Trái</button>
                            <button type="button" onclick="formatText('justifyCenter')" title="Căn giữa">Giữa</button>
                            <button type="button" onclick="formatText('justifyRight')" title="Căn phải">Phải</button>
                            <div style="display:flex; align-items:center; gap:5px; border:1px solid var(--border-color); padding: 0 8px; border-radius: 6px; background: rgba(128,128,128,0.1);">
                                <span style="font-size: 13px;">Màu:</span><input type="color" id="textColorPicker" onchange="changeColor(this.value)" style="border:none; padding:0; width: 22px; height: 26px; background:transparent;">
                            </div>
                        </div>
                        
                        <div id="diaryEditor" class="editor-box" contenteditable="true" placeholder="Trang giấy đang chờ bạn viết..."></div>
                        
                        <div class="actions"><button id="saveBtn" class="btn-save">Lưu trang nhật ký</button></div>
                    </div>
                    
                    <div class="entries-section">
                        <h2>Những ngày đã qua</h2>
                        <div id="entriesList"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- MODAL THÙNG RÁC -->
    <div class="modal-overlay" id="trashModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🗑️ Thùng rác</h2>
                <button class="close-btn" onclick="document.getElementById('trashModal').style.display='none'">&times;</button>
            </div>
            <div id="trashListContainer"></div>
        </div>
    </div>

    <div id="toast">Thông báo</div>

    <!-- MÃ JAVASCRIPT & FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGmLt1ka6mEVFcAlKU0-q6or66jTsuep4",
            authDomain: "uyen-fdf7d.firebaseapp.com",
            projectId: "uyen-fdf7d",
            storageBucket: "uyen-fdf7d.firebasestorage.app",
            messagingSenderId: "539808857702",
            appId: "1:539808857702:web:bf074ecdde987bfcdc37a7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const diaryCollection = collection(db, "diaries");

        let currentUser = null; 
        let trashEntriesData = []; 

        /* --- XỬ LÝ XÁC THỰC --- */
        let isLoginMode = true;
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const authMsg = document.getElementById('auth-message');
        const btnLogin = document.getElementById('btn-login');

        window.toggleAuthMode = function() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) { btnLogin.innerText = "Đang Nhập"; document.querySelector('.auth-switch').innerText = "Chưa có tài khoản? Đăng ký ngay"; } 
            else { btnLogin.innerText = "Tạo Tài Khoản Mới"; document.querySelector('.auth-switch').innerText = "Đã có tài khoản? Đăng nhập"; }
            authMsg.style.display = "none";
        };

        window.handleAuth = async function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) { showAuthMsg("Vui lòng nhập Email và Mật khẩu!", "error"); return; }
            
            btnLogin.disabled = true; btnLogin.innerText = "Đang xử lý...";
            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') showAuthMsg("Email này đã được đăng ký!", "error");
                else if (error.code === 'auth/invalid-credential') showAuthMsg("Sai email hoặc mật khẩu!", "error");
                else if (error.code === 'auth/weak-password') showAuthMsg("Mật khẩu phải có ít nhất 6 ký tự!", "error");
                else showAuthMsg("Lỗi. Vui lòng thử lại!", "error");
                btnLogin.disabled = false; btnLogin.innerText = isLoginMode ? "Đăng Nhập" : "Tạo Tài Khoản Mới";
            }
        };

        window.handleForgotPassword = async function() {
            const email = emailInput.value.trim();
            if(!email) { showAuthMsg("Vui lòng nhập Email để nhận link đặt lại mật khẩu!", "error"); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                showAuthMsg("Đã gửi email khôi phục mật khẩu!", "success");
            } catch (error) { showAuthMsg("Lỗi: Không tìm thấy tài khoản.", "error"); }
        }

        window.handleLogout = async function() { if(confirm("Bạn có chắc muốn đăng xuất?")) await signOut(auth); };

        function showAuthMsg(msg, type) { authMsg.innerText = msg; authMsg.className = "auth-msg " + type; authMsg.style.display = "block"; }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('user-email-display').innerText = user.email;
                loadEntries();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        /* --- XỬ LÝ GIAO DIỆN CHUNG --- */
        document.getElementById('openMenuBtn').addEventListener('click', () => document.getElementById('sidebar').classList.add('open'));
        document.getElementById('closeMenuBtn').addEventListener('click', () => document.getElementById('sidebar').classList.remove('open'));
        document.getElementById('darkModeToggle').addEventListener('change', (e) => e.target.checked ? document.body.classList.add('dark-mode') : document.body.classList.remove('dark-mode'));
        document.getElementById('fontSizeSlider').addEventListener('input', (e) => document.documentElement.style.setProperty('--editor-fs', e.target.value + 'px'));

        window.formatText = function(cmd) { document.execCommand(cmd, false, null); document.getElementById('diaryEditor').focus(); };
        window.changeColor = function(color) { document.execCommand('foreColor', false, color); document.getElementById('diaryEditor').focus(); };
        
        window.insertTab = function() {
            document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;');
            document.getElementById('diaryEditor').focus();
        };

        document.getElementById('diaryEditor').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                insertTab();
            }
        });

        function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.className = "show"; setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000); }
        function formatDate(dateString) { return new Date(dateString).toLocaleDateString('vi-VN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }

        /* --- TẢI DỮ LIỆU --- */
        async function loadEntries() {
            if (!currentUser) return;
            try {
                const q = query(diaryCollection, where("userId", "==", currentUser.uid), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                const entriesList = document.getElementById('entriesList');
                const sidebarHistoryList = document.getElementById('sidebarHistoryList');
                entriesList.innerHTML = ''; sidebarHistoryList.innerHTML = '';
                trashEntriesData = []; 

                let hasActive = false;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const dateStr = formatDate(data.createdAt);
                    const displayTitle = data.title && data.title.trim() !== "" ? data.title : "Nhật ký không tên";

                    if (data.status === 'trash') {
                        trashEntriesData.push({ id: docId, title: displayTitle, date: dateStr, content: data.content });
                        return; 
                    }

                    hasActive = true;
                    const entryDiv = document.createElement('div');
                    entryDiv.className = 'entry';
                    entryDiv.id = `entry-${docId}`;
                    entryDiv.innerHTML = `<button class="delete-btn" onclick="moveToTrash('${docId}')">Xóa</button>
                                          <div class="entry-title">${displayTitle}</div><div class="entry-date">${dateStr}</div>
                                          <div class="entry-content">${data.content}</div>`;
                    entriesList.appendChild(entryDiv);

                    const li = document.createElement('li'); li.className = 'history-item';
                    li.innerHTML = `<a href="#entry-${docId}" onclick="document.getElementById('sidebar').classList.remove('open')">
                                        <div class="history-title">${displayTitle}</div><div class="history-date">${dateStr}</div></a>`;
                    sidebarHistoryList.appendChild(li);
                });

                if(!hasActive) {
                    entriesList.innerHTML = '<p style="color:var(--light-text); font-style:italic; text-align:center;">Bạn chưa có trang nhật ký nào.</p>';
                    sidebarHistoryList.innerHTML = '<li style="font-size: 13px; color: gray;">Trống</li>';
                }
            } catch (error) { console.error(error); }
        }

        /* --- XỬ LÝ LƯU BÀI --- */
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const title = document.getElementById('entryTitle').value.trim();
            const content = document.getElementById('diaryEditor').innerHTML.trim(); 
            if (content === "" || content === "<br>") { showToast("Bạn chưa viết nội dung!"); return; }

            document.getElementById('saveBtn').disabled = true; document.getElementById('saveBtn').textContent = "Đang lưu...";
            try {
                await addDoc(diaryCollection, {
                    userId: currentUser.uid, 
                    title: title, content: content,
                    status: 'active', 
                    createdAt: new Date().toISOString()
                });
                document.getElementById('entryTitle').value = ""; document.getElementById('diaryEditor').innerHTML = "";
                showToast("Đã lưu trang nhật ký mới!"); loadEntries();
            } catch (error) { showToast("Lỗi khi lưu!"); } 
            finally { document.getElementById('saveBtn').disabled = false; document.getElementById('saveBtn').textContent = "Lưu trang nhật ký"; }
        });

        /* --- CÁC HÀM XỬ LÝ THÙNG RÁC --- */
        window.moveToTrash = async function(docId) {
            if(confirm("Chuyển bài viết này vào Thùng rác?")) {
                await updateDoc(doc(db, "diaries", docId), { status: 'trash' });
                showToast("Đã chuyển vào thùng rác!");
                loadEntries(); 
            }
        }

        window.openTrashModal = function() {
            const pinKey = `diary_pin_${currentUser.uid}`;
            let savedPin = localStorage.getItem(pinKey);

            if (!savedPin) {
                let newPin = prompt("💡 Tạo mã PIN (Ví dụ: 1234) bảo vệ Thùng rác:");
                if (!newPin) return; 
                localStorage.setItem(pinKey, newPin);
                savedPin = newPin;
                alert("Đã lưu mã PIN!");
            }

            let enteredPin = prompt("🔒 Nhập mã PIN để mở Thùng rác:");
            if (enteredPin === null) return; 
            if (enteredPin !== savedPin) { alert("Sai mã PIN!"); return; }

            document.getElementById('sidebar').classList.remove('open');
            renderTrashItems();
            document.getElementById('trashModal').style.display = 'flex';
        }

        function renderTrashItems() {
            const container = document.getElementById('trashListContainer');
            container.innerHTML = '';

            if (trashEntriesData.length === 0) {
                container.innerHTML = '<p style="color:var(--light-text); text-align:center;">Thùng rác trống.</p>';
                return;
            }

            trashEntriesData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'trash-item';
                div.innerHTML = `
                    <div class="trash-title">${item.title}</div>
                    <div style="font-size:12px; color:gray; margin-bottom:10px;">${item.date}</div>
                    <div class="trash-actions">
                        <button class="btn-restore" onclick="restoreFromTrash('${item.id}')">🔄 Khôi phục</button>
                        <button class="btn-hard-delete" onclick="hardDelete('${item.id}')">❌ Xóa vĩnh viễn</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.restoreFromTrash = async function(docId) {
            await updateDoc(doc(db, "diaries", docId), { status: 'active' });
            showToast("Đã khôi phục bài viết!");
            loadEntries(); 
            setTimeout(renderTrashItems, 500); 
        }

        window.hardDelete = async function(docId) {
            if(confirm("CẢNH BÁO: Bài viết sẽ bị xóa vĩnh viễn khỏi hệ thống. Tiếp tục?")) {
                await deleteDoc(doc(db, "diaries", docId));
                showToast("Đã xóa vĩnh viễn!");
                loadEntries(); 
                setTimeout(renderTrashItems, 500);
            }
        }
    </script>
</body>
</html>
